# Configuration for the embedding-based address corrector.
# Relative paths are resolved from the project root.
# Environment variables (also read from .env) override the matching setting, shown in brackets.

embedding:
  model: BAAI/bge-m3          # [EMBEDDING_MODEL] model id, also part of the collection fingerprint
  model_path: models/bge-m3   # [EMBEDDING_MODEL_PATH] local copy, used when the folder exists
  device: null                # [EMBEDDING_DEVICE] e.g. cpu, cuda; null = auto

chroma_path: chroma_db        # [CHROMA_PATH]

correction:
  n_results: 15               # [N_RESULTS] vector search candidates per field
  padding: 3                  # [NGRAM_PADDING] extra characters in the n-gram sliding window

cors_origins:                 # [CORS_ORIGINS] comma-separated when set from the environment
  - http://localhost:5173
  - http://127.0.0.1:5173

# One ChromaDB collection per field. `label` is the Bangla label used in addresses ("থানা: ...")
# and in the stored documents; `values` are the correct reference names (duplicates are ignored).
# Editing a list re-embeds that collection on the next startup.
