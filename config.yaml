embedding:
  model: BAAI/bge-m3          # [EMBEDDING_MODEL] model id, also part of the collection fingerprint
  model_path: models/bge-m3   # [EMBEDDING_MODEL_PATH] local copy, used when the folder exists
  device: null                # [EMBEDDING_DEVICE] e.g. cpu, cuda; null = auto

chroma_path: chroma_db        # [CHROMA_PATH]
data_path: data/bangladesh_addresses_data.json  # [DATA_PATH] address records -> district, thana, post office collections

correction:
  n_results: 30               # [N_RESULTS] vector search candidates per field
  padding: 0                  # [NGRAM_PADDING] extra characters in the n-gram sliding window
  sliding_weight: 0.3         # [SLIDING_WEIGHT] final score = sliding_weight * sliding score
  similarity_weight: 0.7      # [SIMILARITY_WEIGHT]            + similarity_weight * vector similarity

cors_origins:                 # [CORS_ORIGINS] comma-separated when set from the environment
  - http://localhost:5173
  - http://127.0.0.1:5173
